# Mock mode, no API keys: `docker compose up --build`, then open http://localhost:43123
name: open-bpo

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: open_bpo
      POSTGRES_USER: open_bpo
      POSTGRES_PASSWORD: open_bpo
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U open_bpo -d open_bpo"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @open-bpo/api dev
    environment:
      API_PORT: 4017
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://open_bpo:open_bpo@postgres:5432/open_bpo
      RECIPE_ID: lead-qualification
      TELEPHONY_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      LLM_PROVIDER: mock
    ports:
      - "4017:4017"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @open-bpo/worker dev
    environment:
      REDIS_URL: redis://redis:6379
      DATABASE_URL: postgresql://open_bpo:open_bpo@postgres:5432/open_bpo
      RECIPE_ID: lead-qualification
      TELEPHONY_PROVIDER: mock
      STT_PROVIDER: mock
      TTS_PROVIDER: mock
      LLM_PROVIDER: mock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: pnpm --filter @open-bpo/web dev
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:4017
    ports:
      - "43123:43123"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres-data:
